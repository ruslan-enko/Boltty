name: BolttyDesign
options:
  bundleIdPrefix: com.boltty
  developmentLanguage: en
  deploymentTarget: { macOS: "26.0" }
  xcodeVersion: "27.0"
targets:
  BolttyDesign:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: ../Sources/Boltty
        excludes: ["main.swift"]
      - path: ../AppIcon.icon
        buildPhase: resources
      - path: ../Resources/Localizable.xcstrings
        buildPhase: resources
      - path: ../Resources/AgentIcons
        type: folder
        buildPhase: resources
      - path: ../Resources/Icons
        type: folder
        buildPhase: resources
      - path: ../Resources/Sounds
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.boltty.design
        PRODUCT_NAME: Boltty Design
        PRODUCT_MODULE_NAME: Boltty
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        SWIFT_OBJC_BRIDGING_HEADER: ../Sources/Boltty/Support/Boltty-Bridging-Header.h
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG BOLTTY_DESIGN
        SWIFT_EMIT_LOC_STRINGS: NO
        STRING_CATALOG_GENERATE_SYMBOLS: YES
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
    scheme: {}
