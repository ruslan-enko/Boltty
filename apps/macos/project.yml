name: Boltty
options:
  bundleIdPrefix: com.boltty
  developmentLanguage: en
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "27.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  Boltty:
    type: application
    platform: macOS
    sources:
      - path: Sources/Boltty
      - path: AppIcon.icon
        buildPhase: resources
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
      - path: Resources/InfoPlist.xcstrings
        buildPhase: resources
      - path: Resources/AgentIcons
        type: folder
        buildPhase: resources
      - path: Resources/Icons
        type: folder
        buildPhase: resources
      # Files, not a folder reference: banners look sounds up at the bundle's top level.
      - path: Resources/Sounds
        buildPhase: resources
      - path: Resources/first-run.mp4
        buildPhase: resources
      - path: ../../LICENSE
        buildPhase: resources
      - path: ../../THIRD_PARTY_NOTICES.md
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.boltty.app
        PRODUCT_NAME: Boltty
        MARKETING_VERSION: "0.15.0"
        CURRENT_PROJECT_VERSION: "40"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Boltty
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: Copyright © 2026 Enko. MIT License.
        CODE_SIGN_ENTITLEMENTS: Boltty.entitlements
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Boltty uses the microphone to turn what you say into a prompt for Boltty AI or Ask Boltty.
        INFOPLIST_KEY_NSAppleEventsUsageDescription: "Boltty reads the files you have selected in Finder so you can talk about them without typing a path."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Boltty uses Apple speech recognition to transcribe what you say to Boltty AI or Ask Boltty.
        # @main AppDelegate owns startup — do not set NSPrincipalClass.
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_STRICT_CONCURRENCY: minimal
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Boltty/Support/Boltty-Bridging-Header.h
        DEAD_CODE_STRIPPING: YES
      configs:
        Debug:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "$(BOLTTY_LOCAL_SIGN_IDENTITY)"
          # Library validation refuses Boltty.debug.dylib, which has no Team ID.
          ENABLE_HARDENED_RUNTIME: NO
          # The unit tests' `@testable import`. Debug only: in a release it
          # exports every internal symbol and holds back the optimiser.
          ENABLE_TESTABILITY: YES
    configFiles:
      Debug: Config/Signing.xcconfig
    scheme:
      testTargets:
        - BolttyTests
        - BolttyUITests
  BolttyTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/BolttyTests
    dependencies:
      - target: Boltty
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.boltty.app.tests
        GENERATE_INFOPLIST_FILE: YES
        DEAD_CODE_STRIPPING: YES
  BolttyUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: Tests/BolttyUITests
    dependencies:
      - target: Boltty
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.boltty.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        DEAD_CODE_STRIPPING: YES
