name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    # macOS minutes are expensive on a private repository; run once it's public.
    if: ${{ !github.event.repository.private }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Architecture
        run: apps/macos/scripts/lint-architecture.sh
      - name: Design contract
        run: apps/macos/scripts/lint-design.sh

  build:
    name: Build
    if: ${{ !github.event.repository.private }}
    # The app needs the macOS 27 SDK; this is GitHub's Xcode 27 image.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v5
      - name: Xcode
        run: xcodebuild -version
      - name: Build
        working-directory: apps/macos
        run: |
          xcodebuild -project Boltty.xcodeproj -scheme Boltty \
            -configuration Debug -destination 'platform=macOS' \
            -derivedDataPath .derivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

  test:
    name: Unit tests
    if: ${{ !github.event.repository.private }}
    runs-on: xcode-27
    # A failing XCTest can look like a hang.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Test
        working-directory: apps/macos
        # Signed to run locally, with the hardened runtime off: the test host
        # loads the debug dylib, which library validation would refuse.
        run: |
          xcodebuild test -project Boltty.xcodeproj -scheme Boltty \
            -destination 'platform=macOS' \
            -derivedDataPath .derivedData \
            -only-testing:BolttyTests \
            CODE_SIGN_IDENTITY=- ENABLE_HARDENED_RUNTIME=NO
