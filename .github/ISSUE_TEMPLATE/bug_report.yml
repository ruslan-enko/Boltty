name: Bug report
description: Something is broken or behaving unexpectedly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in the fields below — it makes triage much faster.

        For **security issues**, do NOT open an issue. See [SECURITY.md](https://github.com/ruslan-enko/boltty/blob/main/SECURITY.md).

  - type: input
    id: version
    attributes:
      label: Boltty version
      description: Settings › General › Version.
      placeholder: "0.2.0 (3)"
    validations:
      required: true

  - type: dropdown
    id: mac
    attributes:
      label: Mac
      options:
        - Apple Silicon
        - Intel
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: macOS version
      placeholder: "macOS 26.1"
    validations:
      required: true

  - type: dropdown
    id: agent
    attributes:
      label: Agent
      description: Which agent the chat was with, if it was in a chat.
      options:
        - Claude Code
        - Codex
        - OpenCode
        - Grok
        - Antigravity
        - Not about an agent
    validations:
      required: true

  - type: input
    id: agent-version
    attributes:
      label: Agent version
      description: Settings › Agents shows it beside the agent's name.
      placeholder: "claude 2.1.283"

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered list of exact steps. The more specific, the faster we can help.
      placeholder: |
        1. Press ⌥Space
        2. Type ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: |
        If applicable, attach screenshots, or paste what Boltty logged while it happened:
        `log stream --level debug --predicate 'subsystem == "com.boltty"'`
        Check it for anything private before you paste it.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and didn't find a duplicate
          required: true
        - label: I am running the latest version (or this happens on `main`)
          required: false
